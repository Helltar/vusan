# optional override: docker compose -f compose.yaml -f compose.workspace.yaml up -d
# the same controller on a separate host; the private bind address and token are mandatory.

services:
  vusan:
    profiles: [bot]

  vusan-workspace:
    ports:
      - "${WORKSPACE_BIND:?set a private listen address}:8080:8080"
    environment:
      WORKSPACE_TOKEN: "${WORKSPACE_TOKEN:?set a shared secret}"
    networks: [default, workspace-control]
