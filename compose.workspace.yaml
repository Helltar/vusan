# The workspace shell, deployed on its own:
#   docker compose --env-file env/workspace.env -f compose.workspace.yaml up -d
#
# This is a separate deployment, not an addition to compose.yaml: it holds the Docker socket and runs
# model-authored shell. One machine is supported; a machine of its own is the recommendation for a
# public deployment. See docs/workspace.md.
#
# `env/workspace.env` is the whole configuration: Compose reads it for the values substituted below and
# hands the same file to the container. Every command needs it, hence --env-file.

name: vusan-workspace

services:
  vusan-workspace:
    image: "${WORKSPACE_IMAGE:-ghcr.io/helltar/vusan-workspace:latest}"
    # only used by `docker compose build` / `up --build`, from a checkout. A deployment that pulls
    # its image never looks at this path, so a missing one costs nothing.
    build:
      context: ./workspace
    container_name: vusan-workspace-container
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    # never the bot's file: this process holds the Docker socket and must not see an application secret.
    env_file: env/workspace.env
    environment:
      # compose resolved the tag for `image:` above; the controller needs the same one for its children.
      WORKSPACE_IMAGE: "${WORKSPACE_IMAGE:-ghcr.io/helltar/vusan-workspace:latest}"
    # IDEA's compose inspection reads a mapping literally, before compose substitutes anything, so no
    # spelling of an interpolated bind address satisfies it.
    #noinspection ComposeUnknownValues
    ports:
      - "${WORKSPACE_BIND:?set an address only the bot can reach}:8080:8080"
    volumes:
      # only this trusted controller can reach docker; workspace containers receive just their own home.
      - /var/run/docker.sock:/var/run/docker.sock
      - vusan-workspace-state:/state
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vusan-workspace-state:
    name: vusan-workspace-state
