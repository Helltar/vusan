# the optional services, run beside the bot on one machine; compose loads this file automatically.
# each is its own standalone deployment, brought in with the compose.beside-bot.yaml beside it and
# configured by the .env in its own directory, exactly as on a machine of its own. `include` rather
# than `extends` on purpose: an included file is interpolated from that .env, where `extends` would
# read the root one and silently ignore the service's.
include:
  - path: [services/workspace/compose.yaml, services/workspace/compose.beside-bot.yaml]
  - path: [services/sites/compose.yaml, services/sites/compose.beside-bot.yaml]

services:
  vusan:
    # its own way out, and one link to each service. the services never share a network.
    networks: [vusan-egress, vusan-workspace-link, vusan-sites-link]

networks:
  vusan-egress:
