# the workspace shell, deployed on its own from the directory holding this file:
#   docker compose up -d
#
# a separate deployment rather than part of compose.yaml: it holds the docker socket and runs
# model-authored shell. a machine of its own is the recommendation for a public deployment; beside the
# bot, the repository's compose.override.yaml includes this file with compose.beside-bot.yaml. see
# docs/workspace.md.
#
# the `.env` beside this file is the whole configuration, in either layout: compose reads it for the
# values substituted below and hands the same file to the container.

name: vusan-workspace

services:
  vusan-workspace:
    image: "${WORKSPACE_IMAGE:-ghcr.io/helltar/vusan-workspace:latest}"
    # only used by `docker compose build` / `up --build`, from a checkout. A deployment that pulls
    # its image never looks at this path, so a missing one costs nothing.
    build:
      context: .
    container_name: vusan-workspace-container
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    # never the bot's file: this process holds the Docker socket and must not see an application secret.
    env_file: .env
    environment:
      # compose resolved the tag for `image:` above; the controller needs the same one for its children.
      WORKSPACE_IMAGE: "${WORKSPACE_IMAGE:-ghcr.io/helltar/vusan-workspace:latest}"
    # IDEA's compose inspection reads a mapping literally, before compose substitutes anything, so no
    # spelling of an interpolated bind address satisfies it.
    #noinspection ComposeUnknownValues
    ports:
      - "${WORKSPACE_BIND:-127.0.0.1}:8080:8080"
    volumes:
      # only this trusted controller can reach docker; workspace containers receive just their own home.
      - /var/run/docker.sock:/var/run/docker.sock
      - vusan-workspace-state:/state
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vusan-workspace-state:
    name: vusan-workspace-state
