name: workspace

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/workspace.yml
      - workspace/**
  pull_request:
    paths:
      - .github/workflows/workspace.yml
      - workspace/**
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # only a pull request may drop an older run: on master every commit gets its own group, so a burst
  # of merges neither cancels the run in progress nor discards the ones waiting behind it — a pending
  # run is dropped when the next one queues, which would leave commits verified by nothing.
  group: workspace-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/helltar/vusan-workspace

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # keep in step with the deno image in workspace/Dockerfile: dependabot bumps
          # that tag, never this input
          deno-version: v2.9.6
          cache: true
      # the comment above is a request; this is the enforcement. dependabot bumps the image tag and
      # leaves the input behind, and the two denos then drift apart unnoticed.
      - name: deno version matches the image
        run: |
          image=$(sed -n 's/^FROM denoland\/deno:debian-\([0-9][0-9.]*\)@.*/\1/p' Dockerfile)
          installed=$(deno --version | head -1 | cut -d' ' -f2)

          if [ -z "$image" ]; then
            echo "::error::cannot read the deno version out of workspace/Dockerfile"
            exit 1
          fi

          if [ "$image" != "$installed" ]; then
            echo "::error::deno drift: workspace/Dockerfile runs $image, this workflow checks the code with $installed. Set deno-version to v$image in .github/workflows/workspace.yml"
            exit 1
          fi

          echo "deno $installed matches workspace/Dockerfile"
      - run: deno ci
      - run: deno fmt --check *.ts deno.json
      - run: deno lint *.ts
      - run: deno check *.ts
      - run: deno task test

  verify-image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./workspace
          file: ./workspace/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: vusan-workspace:ci
          cache-from: type=gha,scope=vusan-workspace
          cache-to: type=gha,mode=max,scope=vusan-workspace
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - name: container lifecycle and isolation
        working-directory: workspace
        env:
          WORKSPACE_TEST_IMAGE: vusan-workspace:ci
        run: deno test --allow-env --allow-net --allow-run=docker integration_test.ts

  publish:
    if: github.event_name == 'release'
    needs: verify-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./workspace
          file: ./workspace/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=vusan-workspace
          cache-to: type=gha,mode=max,scope=vusan-workspace
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
