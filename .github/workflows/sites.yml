name: sites

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/sites.yml
      - sites/**
  pull_request:
    paths:
      - .github/workflows/sites.yml
      - sites/**
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # only a pull request may drop an older run: on master every commit gets its own group, so a burst
  # of merges neither cancels the run in progress nor discards the ones waiting behind it — a pending
  # run is dropped when the next one queues, which would leave commits verified by nothing.
  group: sites-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/helltar/vusan-sites
  NGINX_IMAGE: ghcr.io/helltar/vusan-sites-nginx

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sites
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # keep in step with the deno image in sites/Dockerfile: dependabot bumps
          # that tag, never this input
          deno-version: v2.9.6
          cache: true
      # the comment above is a request; this is the enforcement. dependabot bumps the image tag and
      # leaves the input behind, and the two denos then drift apart unnoticed.
      - name: deno version matches the image
        run: |
          image=$(sed -n 's/^FROM denoland\/deno:debian-\([0-9][0-9.]*\)@.*/\1/p' Dockerfile)
          installed=$(deno --version | head -1 | cut -d' ' -f2)

          if [ -z "$image" ]; then
            echo "::error::cannot read the deno version out of sites/Dockerfile"
            exit 1
          fi

          if [ "$image" != "$installed" ]; then
            echo "::error::deno drift: sites/Dockerfile runs $image, this workflow checks the code with $installed. Set deno-version to v$image in .github/workflows/sites.yml"
            exit 1
          fi

          echo "deno $installed matches sites/Dockerfile"
      - run: deno ci
      - run: deno fmt --check *.ts deno.json
      - run: deno lint *.ts
      - run: deno check *.ts
      - run: deno task test

  verify-image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./sites
          file: ./sites/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: vusan-sites:ci
          cache-from: type=gha,scope=vusan-sites
          cache-to: type=gha,mode=max,scope=vusan-sites
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./sites/nginx
          file: ./sites/nginx/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: vusan-sites-nginx:ci
          cache-from: type=gha,scope=vusan-sites-nginx
          cache-to: type=gha,mode=max,scope=vusan-sites-nginx
      # the nginx half of the deployment is configuration, and a template that fails to render is a
      # dead site host. Check it the only way that means anything: let nginx parse what ships.
      - name: the rendered nginx configuration is valid
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=example.com \
            -keyout /tmp/certs/site.key -out /tmp/certs/site.pem
          cp /tmp/certs/site.pem /tmp/certs/origin-pull-ca.pem
          docker run --rm -e SITES_DOMAIN=example.com \
            -v /tmp/certs:/etc/nginx/certs:ro \
            vusan-sites-nginx:ci nginx -t
      - name: the service starts, serves health and refuses an unauthenticated call
        run: |
          docker run -d --name sites-ci -p 127.0.0.1:8090:8090 \
            -e SITES_DOMAIN=example.com -e SITES_TOKEN=$(openssl rand -hex 32) vusan-sites:ci
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8090/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/health | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8090/site?owner=u42')" = 401
          docker rm -f sites-ci

  publish:
    if: github.event_name == 'release'
    needs: verify-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./sites
          file: ./sites/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=vusan-sites
          cache-to: type=gha,mode=max,scope=vusan-sites
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # the same tags for the nginx half: the two are one deployment and must never drift apart.
      - id: nginx-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.NGINX_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
      - id: push-nginx
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./sites/nginx
          file: ./sites/nginx/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.nginx-metadata.outputs.tags }}
          labels: ${{ steps.nginx-metadata.outputs.labels }}
          cache-from: type=gha,scope=vusan-sites-nginx
          cache-to: type=gha,mode=max,scope=vusan-sites-nginx
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.NGINX_IMAGE }}
          subject-digest: ${{ steps.push-nginx.outputs.digest }}
          push-to-registry: true
