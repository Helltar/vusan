name: vusan image

on:
  push:
    branches: [master]
    paths:
      - .dockerignore
      - .env.example
      - .github/workflows/image.yml
      - Dockerfile
      - build.gradle.kts
      - compose.local.yaml
      - compose.yaml
      - gradle/**
      - gradle.properties
      - settings.gradle.kts
      - src/**
  pull_request:
    paths:
      - .dockerignore
      - .env.example
      - .github/workflows/image.yml
      - Dockerfile
      - build.gradle.kts
      - compose.local.yaml
      - compose.yaml
      - gradle/**
      - gradle.properties
      - settings.gradle.kts
      - src/**
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vusan-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  IMAGE: ghcr.io/helltar/vusan

jobs:
  verify:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker compose --env-file .env.example -f compose.yaml -f compose.local.yaml config --quiet
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha,scope=vusan
          cache-to: type=gha,mode=max,scope=vusan

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker compose --env-file .env.example -f compose.yaml -f compose.local.yaml config --quiet
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=vusan
          cache-to: type=gha,mode=max,scope=vusan
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
