x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  vusan:
    image: ghcr.io/helltar/vusan:latest
    container_name: vusan-container
    restart: unless-stopped
    env_file: .env
    environment:
      WORKSPACE_TOKEN_FILE: /run/workspace-auth/token
    depends_on:
      vusan-workspace:
        condition: service_healthy
    volumes:
      - vusan-data:/app/data
      - vusan-workspace-auth:/run/workspace-auth:ro
    networks: [default, workspace-control]
    logging: *default-logging

  vusan-workspace:
    image: "${WORKSPACE_IMAGE:-ghcr.io/helltar/vusan-workspace:latest}"
    container_name: vusan-workspace-container
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      WORKSPACE_IMAGE: "${WORKSPACE_IMAGE:-ghcr.io/helltar/vusan-workspace:latest}"
      WORKSPACE_NAMESPACE: "${WORKSPACE_NAMESPACE:-vusan}"
      WORKSPACE_TOKEN: "${WORKSPACE_TOKEN:-}"
      WORKSPACE_TOKEN_FILE: /run/workspace-auth/token
      WORKSPACE_NETWORK: "${WORKSPACE_NETWORK:-open}"
      WORKSPACE_TIMEOUT_SECONDS: "${WORKSPACE_TIMEOUT_SECONDS:-120}"
      WORKSPACE_MAX_TIMEOUT_SECONDS: "${WORKSPACE_MAX_TIMEOUT_SECONDS:-600}"
      WORKSPACE_MAX_CONCURRENT: "${WORKSPACE_MAX_CONCURRENT:-2}"
      WORKSPACE_MAX_ACTIVE: "${WORKSPACE_MAX_ACTIVE:-4}"
      WORKSPACE_IDLE_MINUTES: "${WORKSPACE_IDLE_MINUTES:-60}"
      WORKSPACE_DISK_WARN_MB: "${WORKSPACE_DISK_WARN_MB:-2048}"
      WORKSPACE_MIN_FREE_MB: "${WORKSPACE_MIN_FREE_MB:-1024}"
      WORKSPACE_MIN_FREE_INODES: "${WORKSPACE_MIN_FREE_INODES:-10000}"
      WORKSPACE_MEMORY_MB: "${WORKSPACE_MEMORY_MB:-2048}"
      WORKSPACE_CPUS: "${WORKSPACE_CPUS:-2}"
      WORKSPACE_PIDS_LIMIT: "${WORKSPACE_PIDS_LIMIT:-256}"
    volumes:
      # only this trusted controller can reach docker; children receive just their own volume.
      - /var/run/docker.sock:/var/run/docker.sock
      - vusan-workspace-state:/state
      - vusan-workspace-auth:/run/workspace-auth
    networks: [workspace-control]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

networks:
  workspace-control:
    internal: true

volumes:
  vusan-data:
  vusan-workspace-state:
  vusan-workspace-auth:
