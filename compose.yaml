x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  vusan:
    image: ghcr.io/helltar/vusan:latest
    container_name: vusan-container
    restart: unless-stopped
    env_file: .env
    volumes:
      - vusan-data:/app/data
    logging: *default-logging

  vusan-workspace:
    image: ghcr.io/helltar/vusan-workspace:latest
    container_name: vusan-workspace-container
    restart: unless-stopped
    # a command's process tree is killed by process group, and what it orphans is reparented
    # to pid 1 — which reaps nothing unless pid 1 is an init, and the zombies then eat the
    # pid limit below
    init: true
    environment:
      WORKSPACE_ISOLATION: shared
      WORKSPACE_NETWORK: "${WORKSPACE_NETWORK:-open}"
      WORKSPACE_TIMEOUT_SECONDS: "${WORKSPACE_TIMEOUT_SECONDS:-120}"
      WORKSPACE_MAX_TIMEOUT_SECONDS: "${WORKSPACE_MAX_TIMEOUT_SECONDS:-600}"
      WORKSPACE_MAX_CONCURRENT: "${WORKSPACE_MAX_CONCURRENT:-2}"
      WORKSPACE_IDLE_MINUTES: "${WORKSPACE_IDLE_MINUTES:-60}"
      WORKSPACE_QUOTA_MB: "${WORKSPACE_QUOTA_MB:-2048}"
      WORKSPACE_TOKEN: "${WORKSPACE_TOKEN:-}"
    volumes:
      - vusan-workspaces:/work
    cap_drop: [ALL]
    # NET_ADMIN/NET_RAW let the entrypoint install the egress rules in this container's own
    # network namespace before any workspace runs; an unprivileged uid cannot undo them.
    # SETUID/SETGID/CHOWN/DAC_OVERRIDE/KILL are what the supervisor needs to run each
    # workspace as its own user and clean up after it.
    cap_add: [NET_ADMIN, NET_RAW, SETUID, SETGID, CHOWN, DAC_OVERRIDE, KILL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /run
    pids_limit: 512
    mem_limit: "4g"
    cpus: 2.0
    # a public resolver keeps a workspace from learning the names on the local network, whose
    # addresses the egress rules already block. leave it out where public DNS is unreachable.
    # dns: 1.1.1.1
    logging: *default-logging

volumes:
  vusan-data:
  vusan-workspaces:
